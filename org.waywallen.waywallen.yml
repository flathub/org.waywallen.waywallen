app-id: org.waywallen.waywallen
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: waywallen
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-run/waywallen:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.login1
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  - --filesystem=~/snap/steam

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/zsh
  - /share/bash-completion
modules:
  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        commit: 3f17acbf7ffbda81db8be17505554c726e558bb2
        tag: v36.0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protocolbuffers/protobuf/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: qt6-grpc
    buildsystem: cmake-ninja
    post-install:
      - ln -s /app/lib/*-linux-gnu/*.so* /app/lib/
    sources:
      - type: git
        url: https://github.com/qt/qtgrpc.git
        tag: v6.11.1
        commit: 246eb3e3f33bde5ae90bcc8fc1ee54b9381fc60a

  - name: spirv-tools
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2025.4
        commit: 7f2d9ee926f98fc77a3ed1e1e0f113b8c9c49458
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.335.0
        commit: b824a462d4256d720bebb40e78b9eb8f78bbb305
        dest: external/spirv-headers
    cleanup:
      - '*'

  - name: lito
    buildsystem: simple
    build-commands:
      - cp -a bin share /app/
    sources:
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.6.1/lito-linux-x86_64.tar.gz
        sha256: 2e1247634df8b684913302057d89eb1bdd0b5b1e3112608a9470c8af7c25f4c9
        only-arches:
          - x86_64
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.6.1/lito-linux-aarch64.tar.gz
        sha256: bca1b253b7b4afb82ff86984ddb4395d37903e93da9dd93f0df291e884d23c18
        only-arches:
          - aarch64
    cleanup:
      - '*'

  - name: waywallen
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/waywallen/cargo
    build-commands:
      - lito install --profile relwithdebinfo --prefix /app --fetch-seed .lito/fetch-seed
        --offline
    sources:
      - type: git
        url: https://github.com/waywallen/waywallen.git
        commit: 9540f8ca4168e523be9849dcf241c1c4fd75514a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
        tag: v0.3.7
      - ./cargo-sources.json
      - ./waywallen-lito.json
