app-id: org.waywallen.waywallen
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: waywallen
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-run/waywallen:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  - --filesystem=~/snap/steam

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/zsh
  - /share/bash-completion
modules:
  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        commit: 2c74169b34066ceb8ddb6b882fcb3fb32d737a55
        tag: v36.2
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protocolbuffers/protobuf/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: qt6-grpc
    buildsystem: cmake-ninja
    post-install:
      - ln -s /app/lib/*-linux-gnu/*.so* /app/lib/
    sources:
      - type: git
        url: https://github.com/qt/qtgrpc.git
        tag: v6.11.1
        commit: 246eb3e3f33bde5ae90bcc8fc1ee54b9381fc60a

  - name: spirv-tools
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2025.4
        commit: 7f2d9ee926f98fc77a3ed1e1e0f113b8c9c49458
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.335.0
        commit: b824a462d4256d720bebb40e78b9eb8f78bbb305
        dest: external/spirv-headers
    cleanup:
      - '*'

  - name: lua5
    cleanup:
      - '*'
    no-autogen: true
    make-args:
      - "MYCFLAGS=-fPIC -DLUA_USE_LINUX"
      - linux
    make-install-args:
      - INSTALL_TOP=/app
    post-install:
      - make INSTALL_TOP=/app pc > lua5.pc
      - cat lua5.pc.in >> lua5.pc
      - install -Dm644 lua5.pc $FLATPAK_DEST/lib/pkgconfig/lua5.5.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.5.1.tar.gz
        sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
        x-checker-data:
          type: anitya
          project-id: 1847
          url-template: https://www.lua.org/ftp/lua-$version.tar.gz
          versions:
            <: '5.6'
      - type: file
        path: lua5.pc.in

  - name: lito
    buildsystem: simple
    build-commands:
      - cp -a bin share /app/
    sources:
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.8.9/lito-v0.8.9-linux-x86_64.tar.gz
        sha256: 31884c0e853f644f4491bf3a58ee93a12d5513a9810cdeb0e00136cb87dbe610
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: '"https://github.com/litocpp/lito/releases/download/v" + $version
            + "/lito-v" + $version + "-linux-x86_64.tar.gz"'
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.8.9/lito-v0.8.9-linux-aarch64.tar.gz
        sha256: 9bbe75c495ff5b20a00d7eae9782d62d3df09b3e23d4c601d7c03a4378754415
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-query: '"https://github.com/litocpp/lito/releases/download/v" + $version
            + "/lito-v" + $version + "-linux-aarch64.tar.gz"'
    cleanup:
      - '*'

  - name: waywallen
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/waywallen/cargo
    build-commands:
      - lito install --profile relwithdebinfo --prefix /app --source-bundle .lito/source-bundle
        --offline
    sources:
      - type: git
        url: https://github.com/waywallen/waywallen.git
        commit: eddac09fff363c7698746cb0307b13fc542c032f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
        tag: v0.6.1
      - ./waywallen-lito.json
