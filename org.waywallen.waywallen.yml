app-id: org.waywallen.waywallen
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: waywallen
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
  - --share=network
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-run/waywallen:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam/data/Steam
  - --filesystem=~/snap/steam

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /share/zsh
  - /share/bash-completion
modules:
  - name: protobuf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf.git
        commit: 35cd01f9fe9afbeea38cc7b979a3b6bfcde82c03
        tag: v35.1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protocolbuffers/protobuf/releases/latest
          tag-query: .tag_name
          timestamp-query: .published_at
          version-query: $tag | sub("^[vV]"; "")
    cleanup:
      - '*'

  - name: qt6-grpc
    buildsystem: cmake-ninja
    post-install:
      - ln -s /app/lib/*-linux-gnu/*.so* /app/lib/
    sources:
      - type: git
        url: https://github.com/qt/qtgrpc.git
        tag: v6.11.1
        commit: 246eb3e3f33bde5ae90bcc8fc1ee54b9381fc60a

  - name: spirv-tools
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2025.4
        commit: 7f2d9ee926f98fc77a3ed1e1e0f113b8c9c49458
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.335.0
        commit: b824a462d4256d720bebb40e78b9eb8f78bbb305
        dest: external/spirv-headers
    cleanup:
      - '*'

  - name: lito
    buildsystem: simple
    build-commands:
      - cp -a bin share /app/
    sources:
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.7.1/lito-v0.7.1-linux-x86_64.tar.gz
        sha256: 2987265fc8a0fcbe3bc84cad9501441349b25bfd64ef17dc024591caf079cb6a
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-template: https://github.com/litocpp/lito/releases/download/v$version/lito-v$version-linux-x86_64.tar.gz
      - type: archive
        url: https://github.com/litocpp/lito/releases/download/v0.7.1/lito-v0.7.1-linux-aarch64.tar.gz
        sha256: c2aee1c388dcbfa95e5b9018dfa5d2104a81468037a8bcaef1fc14acb6673642
        only-arches:
          - aarch64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/litocpp/lito/releases/latest
          timestamp-query: .published_at
          version-query: .tag_name | sub("^[vV]"; "")
          url-template: https://github.com/litocpp/lito/releases/download/v$version/lito-v$version-linux-aarch64.tar.gz
    cleanup:
      - '*'

  - name: waywallen
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        CARGO_HOME: /run/build/waywallen/cargo
    build-commands:
      - lito install --profile relwithdebinfo --prefix /app --source-bundle .lito/source-bundle --offline
    sources:
      - type: git
        url: https://github.com/waywallen/waywallen.git
        commit: 85502587702a7ac02f06e5f0bdfbcd3d98e12d20
        tag: v0.3.8
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
      - ./waywallen-lito.json
